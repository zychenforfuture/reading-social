name: API Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: collab_comments_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U admin -d collab_comments_test"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=3
      
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Ensure pgvector available in Postgres service (best-effort)
        run: |
          set -euo pipefail
          echo "Attempting to locate Postgres service container..."
          container=$(docker ps --filter ancestor=postgres:16-alpine -q | head -n1 || true)
          if [ -z "$container" ]; then
            container=$(docker ps --filter ancestor=postgres:16 -q | head -n1 || true)
          fi
          if [ -z "$container" ]; then
            echo "Postgres service container not found; skipping pgvector install step."
            exit 0
          fi

          echo "Found Postgres container: $container"
          # Try common package managers to install pgvector (best-effort)
          docker exec "$container" bash -lc "
            if command -v apt-get >/dev/null 2>&1; then
              apt-get update && apt-get install -y build-essential postgresql-server-dev-all git || true
            elif command -v apk >/dev/null 2>&1; then
              apk add --no-cache build-base postgresql-dev git || true
            elif command -v yum >/dev/null 2>&1; then
              yum install -y make gcc postgresql-devel git || true
            fi
            # Try to build and install pgvector from source (may fail on minimal images)
            cd /usr/local/src || mkdir -p /usr/local/src && cd /usr/local/src
            if [ ! -d pgvector ]; then
              git clone https://github.com/pgvector/pgvector.git || true
            fi
            cd pgvector || true
            make || true
            make install || true
          " || true

          # Try to create extensions in the test database (will be ignored if extension not available)
          docker exec "$container" psql -U admin -d collab_comments_test -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;" || true
          docker exec "$container" psql -U admin -d collab_comments_test -c "CREATE EXTENSION IF NOT EXISTS vector;" || true

      - name: Initialize test database schema
        run: |
          PGPASSWORD=testpassword psql -h 127.0.0.1 -p 5433 -U admin -d collab_comments_test -f docker/postgres/init.sql
        env:
          PGPASSWORD: testpassword

      - name: Wait for Postgres and Redis ports
        run: |
          set -euo pipefail
          for i in $(seq 1 90); do
            if (echo > /dev/tcp/127.0.0.1/5433) >/dev/null 2>&1; then
              echo "Postgres is ready on 5433"
              break
            fi
            if [ "$i" -eq 90 ]; then
              echo "Postgres port 5433 not ready in time"
              exit 1
            fi
            sleep 1
          done

          for i in $(seq 1 90); do
            if (echo > /dev/tcp/127.0.0.1/6380) >/dev/null 2>&1; then
              echo "Redis is ready on 6380"
              break
            fi
            if [ "$i" -eq 90 ]; then
              echo "Redis port 6380 not ready in time"
              exit 1
            fi
            sleep 1
          done

      - name: Run lint
        run: pnpm -r lint

      - name: Run tests
        run: pnpm --filter @collab/api test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://admin:testpassword@127.0.0.1:5433/collab_comments_test
          REDIS_URL: redis://127.0.0.1:6380
          JWT_SECRET: test-jwt-secret-for-ci-testing-min-32-chars

      - name: Run coverage
        run: pnpm --filter @collab/api test -- --coverage
        continue-on-error: true
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://admin:testpassword@127.0.0.1:5433/collab_comments_test
          REDIS_URL: redis://127.0.0.1:6380
          JWT_SECRET: test-jwt-secret-for-ci-testing-min-32-chars

      - name: Upload coverage to Coveralls
        if: hashFiles('packages/api/coverage/lcov.info') != ''
        continue-on-error: true
        uses: coverallsapp/github-action@master
        with:
          file: packages/api/coverage/lcov.info
