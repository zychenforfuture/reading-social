name: CI Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run lint
        run: pnpm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build types
        run: pnpm --filter @collab/types build

      - name: Run typecheck
        run: pnpm run typecheck

  test-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: collab_comments_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U admin -d collab_comments_test"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=3
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=3
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6334:6333
        options: >-
          --health-cmd="bash -c '</dev/tcp/localhost/6333' 2>/dev/null && exit 0 || exit 1"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build types
        run: pnpm --filter @collab/types build

      - name: Initialize database schema
        run: |
          PGPASSWORD=testpassword psql -h 127.0.0.1 -p 5433 -U admin -d collab_comments_test -f docker/postgres/init.sql
          pnpm --filter @collab/api run db:migrate
        env:
          DATABASE_URL: postgresql://admin:testpassword@127.0.0.1:5433/collab_comments_test

      - name: Generate JWT Secret
        run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> $GITHUB_ENV

      - name: Run API tests
        run: pnpm --filter @collab/api test -- --coverage
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://admin:testpassword@127.0.0.1:5433/collab_comments_test
          REDIS_URL: redis://127.0.0.1:6380
          QDRANT_URL: http://127.0.0.1:6334
          ADMIN_INIT_EMAIL: test@example.com
          ADMIN_INIT_USERNAME: TestUser
          ADMIN_INIT_PASSWORD: test123

      - name: Upload coverage to Coveralls
        if: hashFiles('packages/api/coverage/lcov.info') != ''
        continue-on-error: true
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: packages/api/coverage/lcov.info

  test-worker:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6334:6333

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build types
        run: pnpm --filter @collab/types build

      - name: Run Worker tests
        run: pnpm --filter @collab/worker test
        env:
          NODE_ENV: test
          REDIS_URL: redis://127.0.0.1:6380
          QDRANT_URL: http://127.0.0.1:6334

  test-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build types
        run: pnpm --filter @collab/types build

      - name: Run Web unit tests
        run: pnpm --filter @collab/web test

  test-e2e:
    needs: [test-api, test-web]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: collab_comments_test
        ports:
          - 5433:5432
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6334:6333

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build all
        run: pnpm run build

      - name: Initialize database schema
        run: |
          PGPASSWORD=testpassword psql -h 127.0.0.1 -p 5433 -U admin -d collab_comments_test -f docker/postgres/init.sql
          pnpm --filter @collab/api run db:migrate
        env:
          DATABASE_URL: postgresql://admin:testpassword@127.0.0.1:5433/collab_comments_test

      - name: Install Playwright Browsers
        run: pnpm --filter @collab/web exec playwright install --with-deps

      - name: Generate JWT Secret
        run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> $GITHUB_ENV

      - name: Run Playwright E2E tests
        run: pnpm --filter @collab/web run test:e2e
        env:
          CI: true
          NODE_ENV: test
          DATABASE_URL: postgresql://admin:testpassword@127.0.0.1:5433/collab_comments_test
          REDIS_URL: redis://127.0.0.1:6380
          QDRANT_URL: http://127.0.0.1:6334
          ADMIN_INIT_EMAIL: test@example.com
          ADMIN_INIT_USERNAME: TestUser
          ADMIN_INIT_PASSWORD: test123
          VITE_API_URL: http://localhost:3000
          FRONTEND_URL: http://localhost:4173

      - name: Upload Playwright reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/web/playwright-report/
          retention-days: 30
