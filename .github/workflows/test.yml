name: API Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: collab_comments_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U admin -d collab_comments_test"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=3
      
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Initialize test database schema
        run: |
          PGPASSWORD=testpassword psql -h 127.0.0.1 -p 5433 -U admin -d collab_comments_test -f docker/postgres/init.sql
          pnpm --filter @collab/api run db:migrate
        env:
          PGPASSWORD: testpassword
          DATABASE_URL: postgresql://admin:testpassword@127.0.0.1:5433/collab_comments_test

      - name: Wait for Postgres and Redis ports
        run: |
          set -euo pipefail
          for i in $(seq 1 90); do
            if (echo > /dev/tcp/127.0.0.1/5433) >/dev/null 2>&1; then
              echo "Postgres is ready on 5433"
              break
            fi
            if [ "$i" -eq 90 ]; then
              echo "Postgres port 5433 not ready in time"
              exit 1
            fi
            sleep 1
          done

          for i in $(seq 1 90); do
            if (echo > /dev/tcp/127.0.0.1/6380) >/dev/null 2>&1; then
              echo "Redis is ready on 6380"
              break
            fi
            if [ "$i" -eq 90 ]; then
              echo "Redis port 6380 not ready in time"
              exit 1
            fi
            sleep 1
          done

      - name: Run lint
        run: pnpm -r lint

      - name: Run tests
        run: pnpm --filter @collab/api test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://admin:testpassword@127.0.0.1:5433/collab_comments_test
          REDIS_URL: redis://127.0.0.1:6380
          JWT_SECRET: test-jwt-secret-for-ci-run-min-32-chars-xyz

      - name: Run coverage
        run: pnpm --filter @collab/api test -- --coverage
        continue-on-error: true
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://admin:testpassword@127.0.0.1:5433/collab_comments_test
          REDIS_URL: redis://127.0.0.1:6380
          JWT_SECRET: test-jwt-secret-for-ci-run-min-32-chars-xyz

      - name: Upload coverage to Coveralls
        if: hashFiles('packages/api/coverage/lcov.info') != ''
        continue-on-error: true
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: packages/api/coverage/lcov.info
